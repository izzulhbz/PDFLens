# Continuous integration: every push to main and every pull request must pass
# all three jobs (they run in parallel).
#
#   backend   lint, types, tests against real Postgres + pgvector, coverage
#             floor, dependency audit, and the evaluation in mock mode
#   frontend  lint, types, tests, production build, dependency audit
#   docker    builds both images, starts the hardened stack and smoke-tests it
#
# Security of the workflow itself:
# - Third-party actions are pinned to a full commit SHA, not a tag: a tag
#   can be moved to point at different code, a commit can't.
# - The token is read-only, and checkout doesn't keep it in .git.
# - No secrets are used. Ollama and Anthropic are never called: the tests and
#   the evaluation use fakes, so CI needs no model downloads or API key.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # The same image as docker-compose.yml.
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: pdflens
          POSTGRES_PASSWORD: ci-only-not-a-secret
          # The integration tests refuse databases whose name doesn't end in _test.
          POSTGRES_DB: pdflens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdflens -d pdflens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pdflens:ci-only-not-a-secret@127.0.0.1:5432/pdflens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        # The lock file is what the Docker image installs; dev tools on top.
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Lint and format (ruff)
        run: |
          ruff check .
          ruff format --check .
          ruff check ../eval --config pyproject.toml
          ruff format --check ../eval --config pyproject.toml

      - name: Type check (mypy, strict)
        run: |
          mypy
          MYPYPATH=. mypy ../eval --config-file pyproject.toml

      - name: Tests (unit + integration) with coverage
        # Fails below the floor in pyproject.toml ([tool.coverage.report]).
        run: pytest --cov --cov-report=term

      - name: Audit Python dependencies (pip-audit)
        # Everything installed: the runtime lock file and the dev tools.
        run: pip-audit --strict --progress-spinner off

      - name: Evaluation (mock mode)
        # Exits 1 if any metric falls below eval/thresholds.json.
        working-directory: .
        run: python eval/run_eval.py --provider mock

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same Node as the frontend Dockerfile's build stage.
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Production build
        run: npx vite build

      - name: Audit npm dependencies
        run: npm audit --audit-level=low

  docker:
    name: Docker images and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Compose requires these. Throwaway values, generated per run below.
      POSTGRES_PASSWORD: placeholder
      SECRET_KEY: placeholder
      # The smoke test talks plain HTTP to 127.0.0.1.
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate throwaway secrets
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build images
        run: docker compose build backend frontend

      - name: Start the stack (without Ollama)
        # --no-deps skips the Ollama service, so no multi-GB model download:
        # nothing in the smoke test needs a model.
        run: |
          docker compose up -d --wait postgres
          docker compose up -d --no-deps --wait backend frontend

      - name: Smoke test over HTTP
        run: sh scripts/smoke_test.sh http://127.0.0.1:8080

      - name: Check the container hardening is in effect
        run: |
          if docker compose exec -T backend touch /app/tampered; then
            echo "backend filesystem is writable"; exit 1
          fi
          docker compose exec -T backend grep -q "CapEff:.*0000000000000000" /proc/1/status
          docker compose exec -T backend grep -q "NoNewPrivs:.*1" /proc/1/status
          docker compose exec -T postgres psql -U pdflens -d pdflens -tAc "show log_error_verbosity" | grep -qx terse
          echo "read-only filesystem, no capabilities, no-new-privileges, terse Postgres log"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
