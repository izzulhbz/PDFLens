# Security headers for the React app (included in each location, because a
# location with its own add_header would otherwise drop the server's ones).
#
# Content-Security-Policy: the page may only load scripts, styles and data
# from its own origin, with no inline scripts and no plugins. Even if an
# attacker got HTML into the page, an injected <script> wouldn't run.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
