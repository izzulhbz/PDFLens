# Nginx serves the built React app and forwards /api to Flask.
# Browser -> Nginx (one origin) -> backend:8000, so the session cookie is
# first-party and the browser never needs CORS.

# Don't advertise the Nginx version in headers and error pages.
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;

    # Slightly above the backend's 20 MB file limit, to allow for the
    # multipart wrapping; the backend enforces the exact limit.
    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite (not append to) X-Forwarded-For with the address Nginx
        # saw, so a client can't invent its own IP to dodge rate limits.
        # The backend trusts this one header (TRUSTED_PROXY_COUNT=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A local model on a CPU can take minutes; the backend allows 180 s.
        proxy_read_timeout 200s;
        # The backend sets its own (stricter) security headers on API responses.
    }

    # Vite puts a content hash in every asset filename, so they never change
    # and can be cached for a long time.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is the single-page app: unknown paths get index.html,
    # which is never cached, so a new deploy is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        try_files $uri /index.html;
    }
}
