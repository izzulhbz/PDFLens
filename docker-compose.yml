# PDFLens local stack.
#   docker compose up --build      then open http://127.0.0.1:8080
#
# frontend (Nginx) is the only way in: it serves the React app and forwards
# /api to the backend, which has no published port of its own.
#
# Every published port is bound to 127.0.0.1, so nothing here is reachable
# from other machines on your network.
#
# Hardening on every container (see "Security" in the README):
# - no-new-privileges: a process can never gain privileges, for example
#   through a setuid binary, even after an exploit.
# The backend and frontend also drop Linux capabilities, run on a read-only
# filesystem (only named volumes and tmpfs are writable) and have memory
# and process limits, so a malicious PDF that exploited the parser couldn't
# change the image, use up the host's memory or fork-bomb it.
name: pdflens

x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    # The official postgres:18 image with the pgvector extension added.
    # Pinned to an exact version so a rebuild can't silently upgrade it.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    # terse: leave DETAIL lines out of Postgres's own log. A rejected insert
    # would otherwise be logged with its whole row ("Failing row contains
    # (...)"), which can be document text or a password hash.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    <<: *no-new-privileges
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdflens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pdflens}
    volumes:
      # Postgres 18 images keep their data in /var/lib/postgresql/18/docker,
      # so the volume mounts at /var/lib/postgresql. (Guides written for
      # Postgres 17 and older mount /var/lib/postgresql/data instead.)
      - pgdata:/var/lib/postgresql
      # *.sql files in this folder run once, when the volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama:
    image: ollama/ollama:0.40.13
    <<: *no-new-privileges
    volumes:
      # Downloaded models live in this volume, so they survive restarts.
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      # Inside the Compose network, services reach each other by service name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pdflens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pdflens}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Secure by default; .env turns it off for plain-HTTP local use.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-8}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Nginx is the one proxy in front, and the backend can't be reached
      # around it, so the client IP Nginx forwards can be trusted.
      TRUSTED_PROXY_COUNT: 1
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5 per minute;30 per hour}
      RATE_LIMIT_LOGIN_ACCOUNT: ${RATE_LIMIT_LOGIN_ACCOUNT:-10 per hour}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-10 per hour}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_TIMEOUT_SECONDS: ${OLLAMA_EMBED_TIMEOUT_SECONDS:-120}
      UPLOAD_DIR: /data/uploads
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-20 per hour}
      RATE_LIMIT_ASK: ${RATE_LIMIT_ASK:-10 per minute;100 per hour}
      RATE_LIMIT_SUMMARY: ${RATE_LIMIT_SUMMARY:-20 per hour}
      # Answering questions. The API key stays in the backend container only.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-10}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_CHAT_TIMEOUT_SECONDS: ${OLLAMA_CHAT_TIMEOUT_SECONDS:-180}
      # Optional "Ollama GPU" provider: an Ollama running natively on the
      # host (not in Docker), so it can use the GPU. Empty turns it off.
      OLLAMA_GPU_BASE_URL: ${OLLAMA_GPU_DOCKER_URL:-}
      OLLAMA_GPU_CHAT_MODEL: ${OLLAMA_GPU_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_GPU_CHAT_TIMEOUT_SECONDS: ${OLLAMA_GPU_CHAT_TIMEOUT_SECONDS:-120}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
    extra_hosts:
      # Docker Desktop defines host.docker.internal already; this makes the
      # same name reach the host on Linux too.
      - "host.docker.internal:host-gateway"
    volumes:
      # Uploaded PDFs survive container rebuilds.
      - uploads:/data/uploads
    <<: *no-new-privileges
    # A Python web app needs no Linux capabilities at all.
    cap_drop: [ALL]
    # Code and libraries can't be modified at runtime; the upload volume
    # and /tmp (gunicorn's worker heartbeat files) are the writable places.
    read_only: true
    tmpfs:
      - /tmp
    # Room for an 8-thread gunicorn worker parsing 20 MB PDFs, but a
    # runaway parse is killed rather than slowing the whole machine.
    mem_limit: 2g
    pids_limit: 256
    depends_on:
      postgres:
        # Wait until Postgres accepts connections, because the backend runs
        # migrations as soon as it starts.
        condition: service_healthy
      ollama:
        # The API can start without Ollama; /api/health/ready reports it.
        condition: service_started
    healthcheck:
      # python:3.13-slim has no curl, so use Python's standard library.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    <<: *no-new-privileges
    # Nginx's master process starts as root to bind port 80 and then switches
    # its workers to the "nginx" user; these are the only capabilities that
    # needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 256m
    pids_limit: 64
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  ollama:
  uploads:
